name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHP syntax check
        run: |
          find boardy-laravel/app boardy-laravel/routes boardy-laravel/config \
               boardy-laravel/database boardy-laravel/bootstrap -name "*.php" -print0 \
            | xargs -0 -n1 php -l

      - name: Python syntax check
        run: python -m compileall boardy-api/ -q


  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env from template
        run: |
          cp .env.example .env

      - name: Build images
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml build

      - name: Start stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
          for i in {1..40}; do
            curl -fs http://localhost/health && break
            echo "waiting for stack... ($i)"
            sleep 3
          done

      - name: Smoke endpoints
        run: |
          curl -f http://localhost/health
          echo
          curl -f http://localhost/api/health
          echo

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down -v


  test:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, bcmath, pdo_sqlite, redis

      - name: Install PHP deps
        working-directory: ./boardy-laravel
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit (HealthTest)
        working-directory: ./boardy-laravel
        run: php artisan test --filter=HealthTest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r boardy-api/requirements.txt pytest httpx

      - name: Run pytest
        working-directory: ./boardy-api
        run: python -m pytest -v