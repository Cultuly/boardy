services:
  laravel:
    build: ./boardy-laravel
    image: ghcr.io/cultuly/boardy-php:latest
    volumes:
      - ./boardy-laravel:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/bootstrap/cache
      - laravel_build:/var/www/html/public/build
      - laravel_storage:/var/www/html/storage
      - ./boardy-laravel/public:/var/www/html/public

  fastapi:
    build: ./boardy-api
    image: ghcr.io/cultuly/boardy-api:latest

  nginx:
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./boardy-laravel:/var/www/html
      # перекрываем прод-маунт laravel_public на хостовый public + том со сборкой
      - ./boardy-laravel/public:/var/www/html/public:ro
      - laravel_build:/var/www/html/public/build:ro

volumes:
  laravel_build:
  