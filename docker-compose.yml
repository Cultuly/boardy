services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./boardy-laravel:/var/www/html
      - laravel_build:/var/www/html/public/build:ro
    depends_on:
      - laravel
      - fastapi
    networks:
      - boardy_net

  laravel:
    image: ghcr.io/cultuly/boardy-php:latest
    volumes:
      - ./boardy-laravel:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/bootstrap/cache
      - laravel_build:/var/www/html/public/build
      - laravel_storage:/var/www/html/storage
    env_file:
      - ./.env
    environment:
      DB_HOST: mysql
      DB_DATABASE: boardy_main
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - boardy_net

  fastapi:
    image: ghcr.io/cultuly/boardy-api:latest
    volumes:
      - laravel_storage:/laravel-storage:ro
    environment:
      DB_HOST: mysql
      DB_DATABASE: boardy_api
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      OAUTH_PUBLIC_KEY: /laravel-storage/oauth-public.key
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - boardy_net

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
    networks:
      - boardy_net

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks:
      - boardy_net

volumes:
  mysql_data:
  redis_data:
  laravel_storage:
  laravel_build:

networks:
  boardy_net:
    driver: bridge
    